<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mint Bot 指令生成器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #f2f4f7;
      color: #1f2329;
      padding: 12px;
      line-height: 1.4;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 2px;
    }
    .app-title {
      font-size: 16px;
      font-weight: 700;
      color: #1f2329;
    }
    .lang-switch {
      display: inline-flex;
      background: #e4e7ed;
      border-radius: 6px;
      padding: 2px;
    }
    .lang-btn {
      border: none;
      background: transparent;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 600;
      color: #606266;
      border-radius: 5px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: #ffffff;
      color: #07c160;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 13px 15px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #646a73;
      margin-bottom: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .bank-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .bank-item {
      position: relative;
      cursor: pointer;
    }
    .bank-item input {
      position: absolute;
      opacity: 0;
    }
    .bank-label {
      display: block;
      text-align: center;
      padding: 9px 4px;
      background: #f5f6f7;
      border: 1.5px solid #dee0e3;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #373c43;
      transition: all 0.15s;
    }
    .bank-item input:checked + .bank-label {
      background: #e8f8f0;
      border-color: #07c160;
      color: #06ad56;
    }
    .text-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1.5px solid #dee0e3;
      border-radius: 8px;
      outline: none;
      background: #fff;
    }
    .text-input:focus {
      border-color: #07c160;
    }
    .name-hint {
      font-size: 12px;
      color: #8f959e;
      margin-top: 6px;
    }
    .name-hint span {
      color: #07c160;
      font-family: monospace;
      font-weight: 600;
    }
    .all-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 9px;
      margin-bottom: 4px;
      border-bottom: 1px solid #eff0f1;
    }
    .rss-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
    }
    .rss-row + .rss-row {
      border-top: 1px dashed #f0f1f2;
    }
    .chk-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      user-select: none;
    }
    .chk-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #07c160;
      cursor: pointer;
    }
    .amount-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .spinner-wrap {
      display: inline-flex;
      align-items: stretch;
      border: 1.5px solid #dee0e3;
      border-radius: 7px;
      overflow: hidden;
      background: #fff;
      height: 36px;
    }
    .spinner-wrap:focus-within {
      border-color: #07c160;
    }
    .spin-input {
      width: 74px;
      border: none;
      outline: none;
      text-align: right;
      padding: 0 8px;
      font-size: 15px;
      font-weight: 600;
      color: #1f2329;
      background: transparent;
      -moz-appearance: textfield;
    }
    .spin-input::-webkit-outer-spin-button,
    .spin-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .spin-btns {
      display: flex;
      flex-direction: column;
      width: 26px;
      border-left: 1px solid #dee0e3;
      background: #f5f6f7;
    }
    .spin-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: #4e5969;
      font-size: 9px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .spin-btn:first-child {
      border-bottom: 1px solid #dee0e3;
    }
    .spin-btn:active {
      background: #e2e4e8;
      color: #07c160;
    }
    .unit-preview {
      min-width: 48px;
      font-size: 13px;
      font-weight: 600;
      color: #07c160;
      text-align: right;
      font-family: monospace;
    }
    .output-area {
      width: 100%;
      min-height: 118px;
      padding: 10px 12px;
      font-family: Consolas, Monaco, monospace;
      font-size: 14px;
      line-height: 1.55;
      background: #f8f9fa;
      border: 1px solid #e5e6eb;
      border-radius: 8px;
      color: #1f2329;
      resize: none;
      margin-bottom: 10px;
    }
    .btn-copy {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #07c160;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-copy:active {
      background: #06ad56;
    }
    .btn-copy.copied {
      background: #2b85e4;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <div class="app-title" id="t_appTitle">Mint Bot 指令生成器</div>
    <div class="lang-switch">
      <button type="button" class="lang-btn active" data-lang="zh-TW">繁</button>
      <button type="button" class="lang-btn" data-lang="zh-CN">简</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title" id="t_bankTitle">1. 選擇銀行 (Bank Prefix)</div>
    <div class="bank-group">
      <label class="bank-item">
        <input type="radio" name="bank" value="7" checked>
        <span class="bank-label">Mint Bank 007</span>
      </label>
      <label class="bank-item">
        <input type="radio" name="bank" value="8">
        <span class="bank-label">Mint Bank 008</span>
      </label>
      <label class="bank-item">
        <input type="radio" name="bank" value="9">
        <span class="bank-label">Mint Bank 009</span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="section-title" id="t_playerTitle">2. 玩家名稱 (Player Name)</div>
    <input type="text" id="playerName" class="text-input" placeholder="輸入玩家名稱（空格自動轉 _ ）" autocomplete="off">
    <div class="name-hint"><span id="t_previewLabel">格式化預覽：</span><span id="formattedName">Player_Name</span></div>
  </div>

  <div class="card">
    <div class="section-title">
      <span id="t_rssTitle">3. 資源類型與數量 (預設 500m)</span>
      <span id="t_stepHint" style="font-weight:400;font-size:12px;">▲▼ 每次 ±100</span>
    </div>

    <div class="all-row">
      <label class="chk-label">
        <input type="checkbox" id="chkAll" checked>
        <span id="t_allLabel">All (全選所有資源)</span>
      </label>
      <span style="font-size:12px;color:#8f959e;">1000m = 1b</span>
    </div>

    <div id="rssList">
      <div class="rss-row">
        <label class="chk-label">
          <input type="checkbox" class="rss-chk" data-rss="food" checked>
          <span id="t_food">Food (糧食)</span>
        </label>
        <div class="amount-box">
          <div class="spinner-wrap">
            <input type="number" class="spin-input" data-rss="food" value="500" step="100" min="0" inputmode="numeric">
            <div class="spin-btns">
              <button type="button" class="spin-btn btn-up">▲</button>
              <button type="button" class="spin-btn btn-down">▼</button>
            </div>
          </div>
          <span class="unit-preview" id="unit_food">500m</span>
        </div>
      </div>

      <div class="rss-row">
        <label class="chk-label">
          <input type="checkbox" class="rss-chk" data-rss="stone" checked>
          <span id="t_stone">Stone (石頭)</span>
        </label>
        <div class="amount-box">
          <div class="spinner-wrap">
            <input type="number" class="spin-input" data-rss="stone" value="500" step="100" min="0" inputmode="numeric">
            <div class="spin-btns">
              <button type="button" class="spin-btn btn-up">▲</button>
              <button type="button" class="spin-btn btn-down">▼</button>
            </div>
          </div>
          <span class="unit-preview" id="unit_stone">500m</span>
        </div>
      </div>

      <div class="rss-row">
        <label class="chk-label">
          <input type="checkbox" class="rss-chk" data-rss="wood" checked>
          <span id="t_wood">Wood (木材)</span>
        </label>
        <div class="amount-box">
          <div class="spinner-wrap">
            <input type="number" class="spin-input" data-rss="wood" value="500" step="100" min="0" inputmode="numeric">
            <div class="spin-btns">
              <button type="button" class="spin-btn btn-up">▲</button>
              <button type="button" class="spin-btn btn-down">▼</button>
            </div>
          </div>
          <span class="unit-preview" id="unit_wood">500m</span>
        </div>
      </div>

      <div class="rss-row">
        <label class="chk-label">
          <input type="checkbox" class="rss-chk" data-rss="ore" checked>
          <span id="t_ore">Ore (鐵礦)</span>
        </label>
        <div class="amount-box">
          <div class="spinner-wrap">
            <input type="number" class="spin-input" data-rss="ore" value="500" step="100" min="0" inputmode="numeric">
            <div class="spin-btns">
              <button type="button" class="spin-btn btn-up">▲</button>
              <button type="button" class="spin-btn btn-down">▼</button>
            </div>
          </div>
          <span class="unit-preview" id="unit_ore">500m</span>
        </div>
      </div>

      <div class="rss-row">
        <label class="chk-label">
          <input type="checkbox" class="rss-chk" data-rss="gold" checked>
          <span id="t_gold">Gold (金幣)</span>
        </label>
        <div class="amount-box">
          <div class="spinner-wrap">
            <input type="number" class="spin-input" data-rss="gold" value="500" step="100" min="0" inputmode="numeric">
            <div class="spin-btns">
              <button type="button" class="spin-btn btn-up">▲</button>
              <button type="button" class="spin-btn btn-down">▼</button>
            </div>
          </div>
          <span class="unit-preview" id="unit_gold">500m</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">
      <span id="t_outTitle">4. 生成指令 (最多 5 行)</span>
      <span id="lineCount">5 / 5</span>
    </div>
    <textarea id="outputBox" class="output-area" readonly></textarea>
    <button id="copyBtn" class="btn-copy">一鍵複製指令</button>
  </div>
</div>

<script>
  (() => {
    const STORAGE_KEY = 'mint_bot_setbal_state_v2';
    const STEP_UNIT = 100;
    const MAX_LINES = 5;

    const I18N = {
      'zh-TW': {
        appTitle: 'Mint Bot 指令生成器',
        bankTitle: '1. 選擇銀行 (Bank Prefix)',
        playerTitle: '2. 玩家名稱 (Player Name)',
        playerPlaceholder: '輸入玩家名稱（空格自動轉 _ ）',
        previewLabel: '格式化預覽：',
        rssTitle: '3. 資源類型與數量 (預設 500m)',
        stepHint: '▲▼ 每次 ±100',
        allLabel: 'All (全選所有資源)',
        food: 'Food (糧食)',
        stone: 'Stone (石頭)',
        wood: 'Wood (木材)',
        ore: 'Ore (鐵礦)',
        gold: 'Gold (金幣)',
        outTitle: '4. 生成指令 (最多 5 行)',
        lineSuffix: ' 行',
        copyBtn: '一鍵複製指令',
        copiedBtn: '已複製指令 ✓',
        copyFail: '複製失敗，請長按指令框手動複製'
      },
      'zh-CN': {
        appTitle: 'Mint Bot 指令生成器',
        bankTitle: '1. 选择银行 (Bank Prefix)',
        playerTitle: '2. 玩家名称 (Player Name)',
        playerPlaceholder: '输入玩家名称（空格自动转 _ ）',
        previewLabel: '格式化预览：',
        rssTitle: '3. 资源类型与数量 (默认 500m)',
        stepHint: '▲▼ 每次 ±100',
        allLabel: 'All (全选所有资源)',
        food: 'Food (粮食)',
        stone: 'Stone (石头)',
        wood: 'Wood (木材)',
        ore: 'Ore (铁矿)',
        gold: 'Gold (金币)',
        outTitle: '4. 生成指令 (最多 5 行)',
        lineSuffix: ' 行',
        copyBtn: '一键复制指令',
        copiedBtn: '已复制指令 ✓',
        copyFail: '复制失败，请长按指令框手动复制'
      },
      'en': {
        appTitle: 'Mint Bot Command Generator',
        bankTitle: '1. Select Bank (Bank Prefix)',
        playerTitle: '2. Player Name',
        playerPlaceholder: 'Enter player name (spaces become _ )',
        previewLabel: 'Formatted: ',
        rssTitle: '3. Resource Type & Amount (Default 500m)',
        stepHint: '▲▼ Step ±100',
        allLabel: 'All (Select All)',
        food: 'Food',
        stone: 'Stone',
        wood: 'Wood',
        ore: 'Ore',
        gold: 'Gold',
        outTitle: '4. Generated Commands (Max 5 Lines)',
        lineSuffix: ' lines',
        copyBtn: 'Copy Commands',
        copiedBtn: 'Copied ✓',
        copyFail: 'Copy failed. Please select and copy manually.'
      }
    };

    const dom = {
      rssList: document.getElementById('rssList'),
      chkAll: document.getElementById('chkAll'),
      playerInput: document.getElementById('playerName'),
      formattedName: document.getElementById('formattedName'),
      outputBox: document.getElementById('outputBox'),
      lineCount: document.getElementById('lineCount'),
      copyBtn: document.getElementById('copyBtn'),
      langBtns: Array.from(document.querySelectorAll('.lang-btn')),
      bankRadios: Array.from(document.querySelectorAll('input[name="bank"]'))
    };

    let currentLang = 'zh-TW';
    let copyTimer = null;

    function getRows() {
      return Array.from(dom.rssList.querySelectorAll('.rss-row'));
    }

    function formatAmount(rawVal) {
      const num = parseFloat(rawVal);
      if (isNaN(num) || num <= 0) return '0m';
      if (num >= 1000) {
        return parseFloat((num / 1000).toFixed(2)) + 'b';
      }
      return num + 'm';
    }

    function formatPlayerName(rawVal) {
      const trimmed = (rawVal || '').trim();
      return trimmed ? trimmed.replace(/\s+/g, '_') : 'Player_Name';
    }

    function applyLanguage(lang) {
      currentLang = I18N[lang] ? lang : 'zh-TW';
      const dict = I18N[currentLang];

      document.title = dict.appTitle;
      document.getElementById('t_appTitle').textContent = dict.appTitle;
      document.getElementById('t_bankTitle').textContent = dict.bankTitle;
      document.getElementById('t_playerTitle').textContent = dict.playerTitle;
      dom.playerInput.placeholder = dict.playerPlaceholder;
      document.getElementById('t_previewLabel').textContent = dict.previewLabel;
      document.getElementById('t_rssTitle').textContent = dict.rssTitle;
      document.getElementById('t_stepHint').textContent = dict.stepHint;
      document.getElementById('t_allLabel').textContent = dict.allLabel;
      document.getElementById('t_food').textContent = dict.food;
      document.getElementById('t_stone').textContent = dict.stone;
      document.getElementById('t_wood').textContent = dict.wood;
      document.getElementById('t_ore').textContent = dict.ore;
      document.getElementById('t_gold').textContent = dict.gold;
      document.getElementById('t_outTitle').textContent = dict.outTitle;

      if (!dom.copyBtn.classList.contains('copied')) {
        dom.copyBtn.textContent = dict.copyBtn;
      }

      dom.langBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang);
      });
    }

    function saveState() {
      try {
        const activeBank = dom.bankRadios.find(r => r.checked);
        const rss = {};
        getRows().forEach(row => {
          const chk = row.querySelector('.rss-chk');
          const input = row.querySelector('.spin-input');
          rss[chk.dataset.rss] = {
            checked: chk.checked,
            amount: input.value
          };
        });

        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          lang: currentLang,
          bank: activeBank ? activeBank.value : '7',
          playerName: dom.playerInput.value,
          rss
        }));
      } catch (_) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const state = JSON.parse(raw);

        if (state.lang) currentLang = state.lang;
        if (state.bank) {
          const target = dom.bankRadios.find(r => r.value === String(state.bank));
          if (target) target.checked = true;
        }
        if (typeof state.playerName === 'string') {
          dom.playerInput.value = state.playerName;
        }
        if (state.rss && typeof state.rss === 'object') {
          getRows().forEach(row => {
            const chk = row.querySelector('.rss-chk');
            const input = row.querySelector('.spin-input');
            const saved = state.rss[chk.dataset.rss];
            if (saved) {
              chk.checked = Boolean(saved.checked);
              if (saved.amount !== undefined && saved.amount !== '') {
                input.value = saved.amount;
              }
            }
          });
        }

        const allChks = getRows().map(r => r.querySelector('.rss-chk'));
        dom.chkAll.checked = allChks.every(c => c.checked);
      } catch (_) {}
    }

    function syncCommands() {
      const activeBank = dom.bankRadios.find(r => r.checked);
      const bankPrefix = activeBank ? activeBank.value : '7';
      const playerName = formatPlayerName(dom.playerInput.value);
      dom.formattedName.textContent = playerName;

      const lines = [];
      getRows().forEach(row => {
        const chk = row.querySelector('.rss-chk');
        const input = row.querySelector('.spin-input');
        const unitSpan = row.querySelector('.unit-preview');
        const formattedUnit = formatAmount(input.value);
        unitSpan.textContent = formattedUnit;

        if (chk.checked && lines.length < MAX_LINES) {
          lines.push(`${bankPrefix}setbal ${playerName} ${chk.dataset.rss} ${formattedUnit}`);
        }
      });

      dom.outputBox.value = lines.join('\n');
      dom.lineCount.textContent = `${lines.length} / ${MAX_LINES}${I18N[currentLang].lineSuffix}`;
      saveState();
    }

    function showCopied() {
      dom.copyBtn.textContent = I18N[currentLang].copiedBtn;
      dom.copyBtn.classList.add('copied');
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => {
        dom.copyBtn.textContent = I18N[currentLang].copyBtn;
        dom.copyBtn.classList.remove('copied');
      }, 1200);
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      try {
        document.execCommand('copy');
        showCopied();
      } catch (_) {
        alert(I18N[currentLang].copyFail);
      }
      document.body.removeChild(ta);
    }

    function bindEvents() {
      dom.langBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          applyLanguage(btn.dataset.lang);
          syncCommands();
        });
      });

      dom.rssList.addEventListener('click', e => {
        const btn = e.target.closest('.spin-btn');
        if (!btn) return;
        const input = btn.closest('.spinner-wrap').querySelector('.spin-input');
        let val = parseFloat(input.value) || 0;
        val = btn.classList.contains('btn-up') ? val + STEP_UNIT : Math.max(0, val - STEP_UNIT);
        input.value = val;
        syncCommands();
      });

      dom.chkAll.addEventListener('change', () => {
        getRows().forEach(row => {
          row.querySelector('.rss-chk').checked = dom.chkAll.checked;
        });
        syncCommands();
      });

      dom.rssList.addEventListener('change', e => {
        if (e.target.classList.contains('rss-chk')) {
          dom.chkAll.checked = getRows().every(row => row.querySelector('.rss-chk').checked);
          syncCommands();
        }
      });

      dom.rssList.addEventListener('input', e => {
        if (e.target.classList.contains('spin-input')) {
          syncCommands();
        }
      });

      dom.bankRadios.forEach(radio => radio.addEventListener('change', syncCommands));
      dom.playerInput.addEventListener('input', syncCommands);

      dom.copyBtn.addEventListener('click', () => {
        const text = dom.outputBox.value;
        if (!text) return;
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(showCopied).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      });
    }

    loadState();
    applyLanguage(currentLang);
    bindEvents();
    syncCommands();
  })();
</script>
</body>
</html>
