<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint Bot - 聯盟銀行指令指南</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #e2e8f0;
            --code-bg: #f1f5f9;
            --badge-member: #0284c7;
            --badge-r4: #d97706;
            --badge-auth: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, 
                        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微軟正黑體", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 16px;
            box-sizing: border-box;
        }

        /* 頂部固定區域 (Header + Config Panel) */
        .sticky-top-panel {
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 1000;
            padding-top: 4px;
            padding-bottom: 12px;
            box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.05);
            border-bottom: 1px solid var(--border-color);
            margin-left: -16px;
            margin-right: -16px;
            padding-left: 16px;
            padding-right: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-container {
            display: flex;
            align-items: center;
            gap: 4px;
            background: white;
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .lang-select {
            border: none;
            background: transparent;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            outline: none;
        }

        .config-card {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 12px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (max-width: 768px) {
            .config-card {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group.full-width {
            grid-column: 1 / -1;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .input-group input, .input-group select {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            background: white;
            font-family: inherit;
            box-sizing: border-box;
            width: 100%;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .player-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px;
            align-items: center;
        }

        .preset-select {
            background-color: #f8fafc;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            white-space: nowrap;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 20px 0 10px 0;
            color: var(--text-main);
            border-left: 4px solid var(--primary);
            padding-left: 8px;
        }

        .cmd-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .cmd-table th, .cmd-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .cmd-table th {
            background-color: var(--code-bg);
            font-weight: 700;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            color: white;
            white-space: nowrap;
        }

        .badge-member { background-color: var(--badge-member); }
        .badge-r4 { background-color: var(--badge-r4); }
        .badge-auth { background-color: var(--badge-auth); }

        .ctrl-box {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .ctrl-box select, .ctrl-box input {
            padding: 4px 6px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.8rem;
            background: #ffffff;
            font-family: inherit;
        }

        .cmd-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background-color: var(--code-bg);
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: 600;
            color: #0f172a;
            display: inline-block;
            word-break: break-all;
            font-size: 0.85rem;
        }

        .btn-copy {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
        }

        .btn-copy:hover {
            background-color: var(--primary-hover);
        }

        .btn-copy.copied {
            background-color: #10b981;
        }

        @media (max-width: 768px) {
            body { padding: 6px; }
            .container { padding: 10px; }
            .sticky-top-panel { margin-left: -10px; margin-right: -10px; padding-left: 10px; padding-right: 10px; }
            .cmd-table, .cmd-table tbody, .cmd-table tr, .cmd-table td {
                display: block;
                width: 100%;
                box-sizing: border-box;
            }
            .cmd-table thead { display: none; }
            .cmd-table tr {
                margin-bottom: 10px;
                border: 1px solid var(--border-color);
                border-radius: 8px;
                padding: 8px;
                background: #fff;
            }
            .cmd-table td {
                border-bottom: none;
                padding: 4px 6px;
            }
            .cmd-table td::before {
                content: attr(data-label);
                font-weight: bold;
                display: block;
                font-size: 0.7rem;
                color: var(--text-muted);
                margin-bottom: 1px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部固定區塊 -->
    <div class="sticky-top-panel">
        <header>
            <h1 id="ui-title">Mint Bot 聯盟銀行指令指南</h1>
            <div class="lang-container">
                <span>🌐</span>
                <select id="langSelect" class="lang-select" onchange="changeLanguage()">
                    <option value="zh-TW" selected>繁體中文</option>
                    <option value="zh-CN">简体中文</option>
                    <option value="en">English</option>
                </select>
            </div>
        </header>

        <div class="config-card">
            <!-- 指令前綴 -->
            <div class="input-group">
                <label id="lbl-prefix">指令前綴 (Prefix)</label>
                <input type="text" id="botPrefix" value="!" oninput="updateAll()">
            </div>

            <!-- 目標玩家名稱與常用名單 -->
            <div class="input-group">
                <label id="lbl-player">目標玩家名稱 (空白自動轉底線)</label>
                <div class="player-row">
                    <input type="text" id="playerName" value="CN ADP" oninput="updateAll()">
                    <select id="presetPlayers" class="preset-select" onchange="selectPresetPlayer()">
                        <option value="" disabled selected>⭐ 常用名單</option>
                        <option value="CN ADP">CN ADP</option>
                        <option value="Amlmeng">Amlmeng</option>
                        <option value="Dreamer Jame">Dreamer Jame</option>
                    </select>
                </div>
            </div>

            <!-- 快速搜尋 (跨滿版兩欄) -->
            <div class="input-group full-width">
                <label id="lbl-search">🔍 快速搜尋指令/說明</label>
                <input type="text" id="searchKeyword" placeholder="輸入關鍵字篩選..." oninput="filterCommands()">
            </div>
        </div>
    </div>

    <!-- 內容區域 -->
    <div id="content-area"></div>
</div>

    function getFormattedPlayer() {
        let p = document.getElementById('playerName').value.trim();
        return p ? p.replace(/\s+/g, '_') : 'Player_1';
    }

    function selectPresetPlayer() {
        const select = document.getElementById('presetPlayers');
        const val = select.value;
        if(val) {
            document.getElementById('playerName').value = val;
            updateAll();
        }
        select.selectedIndex = 0;
    }

    function getPrefix() {
        return document.getElementById('botPrefix').value.trim() || '!';
    }

    function renderPage() {
        const lang = document.getElementById('langSelect').value;
        const t = i18n[lang];

        document.documentElement.lang = lang;
        document.getElementById('ui-title').innerText = t.title;
        document.getElementById('lbl-prefix').innerText = t.lblPrefix;
        document.getElementById('lbl-player').innerText = t.lblPlayer;
        document.getElementById('lbl-search').innerText = t.lblSearch;
        document.getElementById('searchKeyword').placeholder = t.searchPlaceholder;

        const contentArea = document.getElementById('content-area');
        contentArea.innerHTML = '';

        const sections = ['balance', 'claim', 'info', 'admin', 'find', 'guild', 'control', 'move', 'link'];

        sections.forEach(secKey => {
            const secContainer = document.createElement('div');
            secContainer.className = `section-block sec-${secKey}`;

            const secTitle = document.createElement('div');
            secTitle.className = 'section-title';
            secTitle.innerText = t.sections[secKey];
            secContainer.appendChild(secTitle);

            const table = document.createElement('table');
            table.className = 'cmd-table';
            table.innerHTML = `
                <thead>
                    <tr>
                        <th style="width:20%;">${t.thCmd}</th>
                        <th>${t.thDesc}</th>
                        <th style="width:15%;">${t.thAction}</th>
                        <th style="width:15%;">${t.thRank}</th>
                    </tr>
                </thead>
                <tbody id="tbody-${secKey}"></tbody>
            `;
            secContainer.appendChild(table);
            contentArea.appendChild(secContainer);

            const tbody = table.querySelector('tbody');
            const secCmds = commandsData.filter(x => x.sec === secKey);

            secCmds.forEach((item) => {
                const tr = document.createElement('tr');
                tr.className = 'cmd-row';
                tr.setAttribute('data-cmd', item.cmd.toLowerCase());
                tr.setAttribute('data-desc', (t.desc[item.descKey] || '').toLowerCase());
                const rowId = item.id;

                let badgeClass = 'badge-member';
                if(item.rank === 'r4') badgeClass = 'badge-r4';
                if(item.rank === 'auth') badgeClass = 'badge-auth';

                tr.innerHTML = `
                    <td data-label="${t.thCmd}">
                        <strong style="color:var(--primary); font-size:0.95rem;" id="name_${rowId}">${item.cmd}</strong>
                    </td>
                    <td data-label="${t.thDesc}">
                        <div style="font-size: 0.9rem;">${t.desc[item.descKey] || ''}</div>
                        <div class="ctrl-box" id="ctrl_${rowId}"></div>
                        <div style="margin-top:4px; font-size: 0.85rem;">
                            範例: <span class="cmd-code" id="code_${rowId}"></span>
                        </div>
                    </td>
                    <td data-label="${t.thAction}">
                        <button class="btn-copy" onclick="copyCode('code_${rowId}', this)">${t.copy}</button>
                    </td>
                    <td data-label="${t.thRank}">
                        <span class="badge ${badgeClass}">${t.ranks[item.rank]}</span>
                    </td>
                `;
                tbody.appendChild(tr);

                buildControls(item.ctrlType, `ctrl_${rowId}`, rowId, t);
            });
        });

        updateAll();
        filterCommands();
    }

    function updateAll() {
        const p = getPrefix();
        const player = getFormattedPlayer();

        commandsData.forEach((item) => {
            const rowId = item.id;
            const codeEl = document.getElementById(`code_${rowId}`);
            const nameEl = document.getElementById(`name_${rowId}`);
            if(!codeEl) return;

            let realCmd = item.cmd.replace(/^!/, p);
            if(nameEl) nameEl.innerText = realCmd;

            let result = realCmd;

            if(item.id === 'transfer') {
                let rss = document.getElementById(`sel_rss_${rowId}`)?.value || '';
                let amt = document.getElementById(`inp_amt_${rowId}`)?.value || '100M';
                result = `${p}transfer ${player} ${rss} ${amt}`.replace(/\s+/g, ' ').trim();
            }
            else if(item.id === 'setacc') {
                result = `${p}setacc ${player}`;
            }
            else if(['food','stone','wood','ore','gold'].includes(item.id)) {
                let amt = document.getElementById(`inp_amt_${rowId}`)?.value || '5M';
                result = `${p}${item.id} ${amt}`;
            }
            else if(item.id === 'rss') {
                let f = document.getElementById(`r_f_${rowId}`)?.value || '0';
                let s = document.getElementById(`r_s_${rowId}`)?.value || '0';
                let w = document.getElementById(`r_w_${rowId}`)?.value || '0';
                let o = document.getElementById(`r_o_${rowId}`)?.value || '0';
                let g = document.getElementById(`r_g_${rowId}`)?.value || '0';
                result = `${p}rss ${f} ${s} ${w} ${o} ${g}`;
            }
            else if(item.id.startsWith('donate')) {
                let amt = document.getElementById(`inp_amt_${rowId}`)?.value || '5M';
                result = `${p}${item.id} ${player} ${amt}`;
            }
            else if(item.id === 'pos' || item.id === 'quest') {
                let opt = document.getElementById(`sel_opt_${rowId}`)?.value || '';
                result = `${p}${item.id} ${opt}`.trim();
            }
            else if(item.id === 'stats') {
                let opt = document.getElementById(`sel_opt_${rowId}`)?.value || '';
                result = `${p}stats ${opt}`.trim();
            }
            else if(item.id === 'shield') {
                let opt = document.getElementById(`sel_opt_${rowId}`)?.value || '';
                result = `${p}shield ${opt}`.trim();
            }
            else if(item.id === 'pstats') {
                result = `${p}pstats ${player}`;
            }
            else if(item.id === 'adminbal') {
                let mode = document.getElementById(`sel_mode_${rowId}`)?.value || 'bank';
                if(mode === 'chat') result = `${p}adminbal chat`;
                else if(mode === 'player') result = `${p}adminbal ${player}`;
                else result = `${p}adminbal`;
            }
            else if(item.id.startsWith('admin') && item.id !== 'adminbag' && item.id !== 'adminrss') {
                let amt = document.getElementById(`inp_amt_${rowId}`)?.value || '5M';
                result = `${p}${item.id} ${player} ${amt}`;
            }
            else if(item.id === 'adminrss') {
                let f = document.getElementById(`r_f_${rowId}`)?.value || '0';
                let s = document.getElementById(`r_s_${rowId}`)?.value || '0';
                let w = document.getElementById(`r_w_${rowId}`)?.value || '0';
                let o = document.getElementById(`r_o_${rowId}`)?.value || '0';
                let g = document.getElementById(`r_g_${rowId}`)?.value || '0';
                result = `${p}adminrss ${f} ${s} ${w} ${o} ${g} ${player}`;
            }
            else if(item.id === 'setbal') {
                let rss = document.getElementById(`sel_rss_${rowId}`)?.value || 'food';
                let amt = document.getElementById(`inp_amt_${rowId}`)?.value || '100M';
                result = `${p}setbal ${player} ${rss} ${amt}`;
            }
            else if(item.id === 'setrsslimit') {
                let rss = document.getElementById(`sel_rss_${rowId}`)?.value || 'gold';
                let amt = document.getElementById(`inp_amt_${rowId}`)?.value || '100M';
                result = `${p}setrsslimit ${rss} ${amt}`;
            }
            else if(item.id.startsWith('findtile')) {
                let t = document.getElementById(`sel_tile_${rowId}`)?.value || 'food';
                let l = document.getElementById(`sel_lvl_${rowId}`)?.value || '4';
                let c = document.getElementById(`sel_chat_${rowId}`)?.value || '';
                result = `${p}${item.id} ${t} ${l} ${c}`.replace(/\s+/g, ' ').trim();
            }
            else if(item.id.startsWith('findmonster')) {
                let m = (document.getElementById(`inp_m_${rowId}`)?.value || 'hardrox').replace(/\s+/g, '_');
                let l = document.getElementById(`sel_lvl_${rowId}`)?.value || '2';
                let c = document.getElementById(`sel_chat_${rowId}`)?.value || '';
                result = `${p}${item.id} ${m} ${l} ${c}`.replace(/\s+/g, ' ').trim();
            }
            else if(item.id.startsWith('findnest')) {
                let l = document.getElementById(`sel_lvl_${rowId}`)?.value || '3';
                let c = document.getElementById(`sel_chat_${rowId}`)?.value || 'chat';
                result = `${p}${item.id} ${l} ${c}`.replace(/\s+/g, ' ').trim();
            }
            else if(item.id === 'whitelist') {
                let rank = document.getElementById(`sel_rank_${rowId}`)?.value || '';
                result = `${p}whitelist ${player} ${rank}`.replace(/\s+/g, ' ').trim();
            }
            else if(item.id === 'blacklist') {
                let note = document.getElementById(`inp_note_${rowId}`)?.value || '';
                result = `${p}blacklist ${player} ${note}`.replace(/\s+/g, ' ').trim();
            }
            else if(item.id === 'unlistwhite' || item.id === 'unlistblack') {
                result = `${p}${item.id} ${player}`;
            }
            else if(item.id === 'addtitle') {
                let title = (document.getElementById(`inp_title_${rowId}`)?.value || 'chief').replace(/\s+/g, '_');
                result = `${p}addtitle ${player} ${title}`;
            }
            else if(item.id === 'joinca') {
                let num = document.getElementById(`inp_num_${rowId}`)?.value || '1';
                let f = document.getElementById(`sel_f_${rowId}`)?.value || '';
                result = `${p}joinca ${num} ${f}`.trim();
            }
            else if(item.id === 'buildspam') {
                let amt = document.getElementById(`inp_amt_${rowId}`)?.value || '120';
                let delay = document.getElementById(`inp_delay_${rowId}`)?.value || '7';
                result = `${p}buildspam ${amt} ${delay}`;
            }
            else if(item.id === 'setgather') {
                let mode = document.getElementById(`sel_mode_${rowId}`)?.value || 'off';
                result = `${p}setgather ${mode}`;
            }
            else if(item.id === 'hunt') {
                let mode = document.getElementById(`sel_mode_${rowId}`)?.value || 'coords';
                if(mode === 'coords') {
                    let x = document.getElementById(`inp_x_${rowId}`)?.value || '150';
                    let y = document.getElementById(`inp_y_${rowId}`)?.value || '166';
                    result = `${p}hunt ${x} ${y}`;
                } else {
                    result = `${p}hunt ${mode}`;
                }
            }
            else if(item.id === 'recall') {
                let opt = document.getElementById(`sel_opt_${rowId}`)?.value || '';
                result = `${p}recall ${opt}`.trim();
            }
            else if(item.id === 'camp' || item.id === 'campleader' || item.id === 'relocateCoords') {
                let x = document.getElementById(`inp_x_${rowId}`)?.value || '243';
                let y = document.getElementById(`inp_y_${rowId}`)?.value || '209';
                let baseName = item.id === 'relocateCoords' ? 'relocate' : item.id;
                result = `${p}${baseName} ${x} ${y}`;
            }
            else if(item.id === 'relocateRand') {
                result = `${p}relocate rand`;
            }
            else if(item.id === 'migrate') {
                let k = document.getElementById(`inp_k_${rowId}`)?.value || '60';
                let x = document.getElementById(`inp_x_${rowId}` )?.value || '200';
                let y = document.getElementById(`inp_y_${rowId}`)?.value || '900';
                result = `${p}migrate ${k} ${x} ${y}`;
            }
            else if(item.ctrlType === 'text_input') {
                let txt = document.getElementById(`inp_text_${rowId}`)?.value || '';
                result = `${p}${item.id} ${txt}`.trim();
            }

            codeEl.innerText = result;
        });
    }

    function filterCommands() {
        const keyword = document.getElementById('searchKeyword').value.toLowerCase().trim();
        const sections = ['balance', 'claim', 'info', 'admin', 'find', 'guild', 'control', 'move', 'link'];

        sections.forEach(secKey => {
            const block = document.querySelector(`.sec-${secKey}`);
            if(!block) return;
            const rows = block.querySelectorAll('.cmd-row');
            let visibleCount = 0;

            rows.forEach(row => {
                const cmd = row.getAttribute('data-cmd');
                const desc = row.getAttribute('data-desc');
                if(keyword === '' || cmd.includes(keyword) || desc.includes(keyword)) {
                    row.style.display = '';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            });

            block.style.display = visibleCount === 0 ? 'none' : '';
        });
    }

    function changeLanguage() {
        renderPage();
    }

    function copyCode(elementId, btn) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => {
            const lang = document.getElementById('langSelect').value;
            const originalText = btn.innerText;
            btn.innerText = i18n[lang].copied;
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('copied');
            }, 1200);
        });
    }

    window.onload = () => {
        renderPage();
    };
</script>
